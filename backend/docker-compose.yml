services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visual_assistant}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visual_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in backend/.env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in backend/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_data:/data

  ollama:
    image: ollama/ollama:latest
    # Bound sustained inference CPU usage on the development laptop.
    cpus: 2.0
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  turn:
    profiles: ["webrtc"]
    image: ghcr.io/coturn/coturn:4.18.0-alpine
    command:
      - --no-cli
      - --no-tls
      - --fingerprint
      - --realm=sora.local
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-}
      - --external-ip=${TURN_PUBLIC_HOST:-}
      - --listening-port=3478
      - --min-port=48000
      - --max-port=48099
      - --no-multicast-peers
      - --log-file=stdout
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Keep relay ports below macOS's ephemeral range (49152–65535).
      - "48000-48099:48000-48099/udp"
    restart: unless-stopped

  api:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}@postgres:5432/${POSTGRES_DB:-visual_assistant}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET:-frames}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in backend/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in backend/.env}
      OLLAMA_URL: http://ollama:11434
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      YOLO_MODEL: /app/models/yolo11n.pt
      AUTO_MIGRATE: "true"
      FRAME_RETENTION_HOURS: ${FRAME_RETENTION_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8081","http://localhost:3000"]}
      ICE_SERVERS: ${ICE_SERVERS:-[]}
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
      ollama:
        condition: service_started
    volumes:
      - model_data:/app/models
      - local_storage_data:/app/data
      # Local development: source changes survive container recreation.
      - ./app:/app/app:ro
      - ./migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
    restart: unless-stopped

volumes:
  postgres_data:
  object_data:
  ollama_data:
  model_data:
  local_storage_data:
